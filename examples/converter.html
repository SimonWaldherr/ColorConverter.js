<html>
<head>
  <meta charset="utf-8">
  <title>ColorConverter - Converter Demo</title>
  <link href="./style.css" rel="stylesheet" type="text/css">
  <style>
h1{position:relative;top:-50px;font-family:"Helvetica Neue";margin-bottom:-40px;}
#main{width:640px;margin:auto;padding:40px 20px;border-radius:25px;}
.panel{background:#aaaaaa;border-radius:15px;padding:15px;margin:8px 0;overflow:hidden;}
.panel label{display:inline-block;min-width:60px;font-weight:bold;}
.panel input[type=text]{width:300px;padding:4px 6px;border-radius:6px;border:1px solid #888;font-size:14px;}
.panel input[readonly]{background:#f0f0f0;color:#333;}
#swatch{width:100%;height:100px;border-radius:12px;margin-bottom:12px;background:#cccccc;transition:background 0.2s;}
#hexinput{width:220px;padding:6px 10px;border-radius:8px;border:2px solid #888;font-size:18px;font-family:monospace;}
#colorpicker{vertical-align:middle;width:44px;height:44px;border:none;padding:0;cursor:pointer;border-radius:8px;}
.row{margin:6px 0;}
  </style>
  <script src="../dist/colorconverter.umd.js" type="text/javascript"></script>
  <script>
    function updateFromHex(hex) {
      if (hex.charAt(0) === '#') { hex = hex.substr(1); }
      var rgb = colorconv.HEX2RGB(hex);
      if (!rgb) { return; }

      var hsl  = colorconv.RGB2HSL(rgb);
      var hsv  = colorconv.RGB2HSV(rgb);
      var yuv  = colorconv.RGB2YUV(rgb);
      var cmyk = colorconv.RGB2CMYK(rgb);
      var fullhex = '#' + colorconv.RGB2HEX(rgb);

      document.getElementById('swatch').style.backgroundColor = fullhex;
      document.getElementById('hexinput').value = fullhex;
      document.getElementById('colorpicker').value = fullhex;

      document.getElementById('out_rgb').value  = 'rgb(' + rgb[0] + ', ' + rgb[1] + ', ' + rgb[2] + ')';
      document.getElementById('out_hsl').value  = 'hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] + '%)';
      document.getElementById('out_hsv').value  = 'hsv(' + (Math.round(hsv[0] * 3600) / 10) + '\u00b0, ' + (Math.round(hsv[1] * 1000) / 10) + '%, ' + (Math.round(hsv[2] * 1000) / 10) + '%)';
      document.getElementById('out_yuv').value  = 'yuv(' + yuv[0] + ', ' + yuv[1] + ', ' + yuv[2] + ')';
      document.getElementById('out_cmyk').value = 'cmyk(' + cmyk[0] + '%, ' + cmyk[1] + '%, ' + cmyk[2] + '%, ' + cmyk[3] + '%)';
    }

    function onHexInput() {
      var val = document.getElementById('hexinput').value;
      updateFromHex(val);
    }

    function onPickerChange() {
      var val = document.getElementById('colorpicker').value;
      updateFromHex(val);
    }

    function onRgbInput() {
      var val = document.getElementById('out_rgb').value;
      var rgb = colorconv.parse(val);
      if (rgb) {
        updateFromHex(colorconv.RGB2HEX(rgb));
      }
    }

    function onHslInput() {
      var val = document.getElementById('out_hsl').value;
      var rgb = colorconv.parse(val);
      if (rgb) {
        updateFromHex(colorconv.RGB2HEX(rgb));
      }
    }

    window.onload = function() {
      updateFromHex('3a7bd5');
    };
  </script>
</head>
<body>
  <div id="main">
    <h1><a href="../index.html">&#8656; ColorConverter</a></h1>
    <h2>Converter Demo</h2>

    <div class="panel">
      <div id="swatch"></div>
      <input type="color" id="colorpicker" onchange="onPickerChange();" title="Pick a color">
      &nbsp;
      <input type="text" id="hexinput" placeholder="#rrggbb" oninput="onHexInput();" maxlength="7" style="font-family:monospace;">
    </div>

    <div class="panel">
      <div class="row"><label>RGB</label><input type="text" id="out_rgb" oninput="onRgbInput();" placeholder="rgb(r, g, b)"></div>
      <div class="row"><label>HSL</label><input type="text" id="out_hsl" oninput="onHslInput();" placeholder="hsl(h, s%, l%)"></div>
      <div class="row"><label>HSV</label><input type="text" id="out_hsv" readonly="readonly" placeholder="hsv(h°, s%, v%)"></div>
      <div class="row"><label>YUV</label><input type="text" id="out_yuv" readonly="readonly" placeholder="yuv(y, u, v)"></div>
      <div class="row"><label>CMYK</label><input type="text" id="out_cmyk" readonly="readonly" placeholder="cmyk(c%, m%, y%, k%)"></div>
    </div>
  </div>
</body>
</html>
